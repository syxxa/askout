<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>hi cutie</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia, serif;
}

/* ---------- Background ---------- */

body{

background:linear-gradient(
135deg,
#ffd6e8,
#ffe8fa,
#e7f2ff,
#dff8f0
);

background-size:400% 400%;

animation:gradient 15s ease infinite;

display:flex;
justify-content:center;
align-items:center;

}

@keyframes gradient{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

/* ---------- Floating hearts ---------- */

.heart{

position:absolute;
bottom:-50px;

font-size:25px;

animation:float linear infinite;

opacity:.65;

pointer-events:none;

}

@keyframes float{

0%{

transform:translateY(0) rotate(0deg);

opacity:0;

}

20%{

opacity:.8;

}

100%{

transform:translateY(-120vh) rotate(360deg);

opacity:0;

}

}

/* ---------- Stars ---------- */

.star{

position:absolute;

background:white;

width:3px;

height:3px;

border-radius:50%;

box-shadow:0 0 12px white;

animation:twinkle 2s infinite alternate;

}

@keyframes twinkle{

from{

opacity:.2;
transform:scale(.5);

}

to{

opacity:1;
transform:scale(1.6);

}

}

/* ---------- Main Card ---------- */

.card{

width:700px;
max-width:90%;

padding:60px;

border-radius:35px;

backdrop-filter:blur(18px);

background:rgba(255,255,255,.23);

border:1px solid rgba(255,255,255,.35);

box-shadow:0 15px 50px rgba(0,0,0,.12);

text-align:center;

position:relative;

}

h1{

font-size:52px;

color:white;

text-shadow:0 3px 10px rgba(0,0,0,.15);

margin-bottom:20px;

}

.subtitle{

font-size:23px;

color:white;

margin-bottom:55px;

}

/* ---------- Buttons ---------- */

#yes,#no{

padding:18px 38px;

font-size:22px;

border:none;

border-radius:18px;

cursor:pointer;

transition:.3s;

font-weight:bold;

}

#yes{

background:#ff7ca8;

color:white;

box-shadow:0 8px 20px rgba(255,124,168,.4);

}

#yes:hover{

transform:scale(1.12);

}

#no{

position:absolute;

background:white;

color:#555;

left:54%;
top:77%;

}

/* ---------- Fade ---------- */

.fade{

animation:fadeout .8s forwards;

}

@keyframes fadeout{

to{

opacity:0;
transform:scale(.95);

}

}

</style>

</head>

<body>

<div class="card" id="card">

<h1>i think you're cute 🩷</h1>

<div class="subtitle">

will you be my boyfriend?

</div>

<button id="yes">Yes 💖</button>

<button id="no">No</button>

</div>

<script>

/* ---------------- Stars ---------------- */

for(let i=0;i<70;i++){

const s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(s);

}

/* ---------------- Hearts ---------------- */

const emojis=["💖","💕","💗","💘","🩷"];

setInterval(()=>{

const h=document.createElement("div");

h.className="heart";

h.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=6+Math.random()*5+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},11000);

},500);

/* ---------------- No Button ---------------- */

const no=document.getElementById("no");

let x=window.innerWidth*.58;

let y=window.innerHeight*.68;

document.addEventListener("mousemove",(e)=>{

const rect=no.getBoundingClientRect();

const cx=rect.left+rect.width/2;
const cy=rect.top+rect.height/2;

const dx=e.clientX-cx;
const dy=e.clientY-cy;

const dist=Math.sqrt(dx*dx+dy*dy);

if(dist<170){

x+=(-dx/dist)*42;
y+=(-dy/dist)*42;

x=Math.max(0,Math.min(window.innerWidth-rect.width,x));
y=Math.max(0,Math.min(window.innerHeight-rect.height,y));

no.style.left=x+"px";
no.style.top=y+"px";

}

});

/* ---------------- Yes ---------------- */

document.getElementById("yes").onclick=()=>{

for(let i=0;i<180;i++){

const c=document.createElement("div");

c.innerHTML=["🎉","✨","💖","💕"][Math.floor(Math.random()*4)];

c.style.position="fixed";

c.style.left=50+"vw";

c.style.top=50+"vh";

c.style.fontSize=18+Math.random()*20+"px";

c.style.pointerEvents="none";

const angle=Math.random()*Math.PI*2;

const speed=4+Math.random()*8;

let vx=Math.cos(angle)*speed;
let vy=Math.sin(angle)*speed;

document.body.appendChild(c);

let px=window.innerWidth/2;
let py=window.innerHeight/2;

const id=setInterval(()=>{

px+=vx;
py+=vy;

vy+=0.18;

c.style.left=px+"px";
c.style.top=py+"px";

c.style.opacity-=0.015;

if(py>window.innerHeight+100){

clearInterval(id);

c.remove();

}

},16);

}

document.getElementById("card").classList.add("fade");

setTimeout(()=>{

window.location="memories.html";

},900);

};

</script>

</body>
</html>
