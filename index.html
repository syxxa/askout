<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>hi cutie ❤️</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Quicksand:wght@500;700&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

font-family:'Quicksand',sans-serif;

background:linear-gradient(
120deg,
#ffd9e8,
#f5dcff,
#dff3ff,
#fff1d6
);

background-size:400% 400%;

animation:bgmove 15s ease infinite;

}


@keyframes bgmove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}


/* ---------- stars ---------- */


.star{

position:absolute;

width:4px;
height:4px;

background:white;

border-radius:50%;

box-shadow:0 0 15px white;

animation:twinkle 2s infinite alternate;

}


@keyframes twinkle{

from{
opacity:.2;
transform:scale(.5);
}

to{
opacity:1;
transform:scale(1.5);
}

}



/* ---------- hearts ---------- */


.heart{

position:absolute;

bottom:-40px;

font-size:25px;

animation:rise linear forwards;

opacity:.7;

}


@keyframes rise{


0%{

transform:translateY(0) rotate(0);

opacity:0;

}


20%{

opacity:.8;

}


100%{

transform:translateY(-120vh) rotate(360deg);

opacity:0;

}

}




/* ---------- main card ---------- */


.card{

width:650px;

max-width:90%;

padding:55px;

text-align:center;


background:rgba(255,255,255,.28);

backdrop-filter:blur(20px);


border-radius:40px;


border:1px solid rgba(255,255,255,.5);


box-shadow:

0 20px 60px rgba(0,0,0,.15);


transition:.8s;

}



h1{

font-family:'Caveat',cursive;

font-size:70px;

color:white;

text-shadow:

0 4px 15px rgba(0,0,0,.15);


margin-bottom:15px;

}


.question{

font-size:27px;

color:white;

margin-bottom:45px;

}




/* ---------- buttons ---------- */


.buttons{

position:relative;

width:380px;

height:90px;

margin:auto;

}


button{

font-family:'Quicksand',sans-serif;

font-size:22px;

font-weight:bold;

padding:17px 38px;

border-radius:20px;

border:none;

cursor:pointer;

position:absolute;

transition:.25s;

}


#yes{

left:45px;

background:#ff8fb5;

color:white;

box-shadow:

0 10px 25px rgba(255,100,160,.35);

}


#yes:hover{

transform:scale(1.12);

}



#no{

left:235px;

background:white;

color:#777;

}



/* funny message */


#message{

position:absolute;

width:100%;

bottom:-35px;

left:0;

color:white;

font-size:18px;

opacity:0;

transition:.3s;

}



/* fade */

.fade{

opacity:0;

transform:scale(.9);

}


</style>

</head>



<body>



<div class="card" id="card">


<h1>i think you're cute 🩷</h1>


<div class="question">

will you be my boyfriend?

</div>



<div class="buttons">


<button id="yes">
Yes 💖
</button>


<button id="no">
No 🤍
</button>


<div id="message">
</div>


</div>


</div>





<script>



/* ---------- stars ---------- */


for(let i=0;i<80;i++){


let star=document.createElement("div");

star.className="star";


star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";


star.style.animationDelay=Math.random()*3+"s";


document.body.appendChild(star);


}



/* ---------- hearts ---------- */


setInterval(()=>{


let heart=document.createElement("div");


heart.className="heart";


heart.innerHTML=
["💖","💕","🩷","✨","💗"]
[Math.floor(Math.random()*5)];


heart.style.left=Math.random()*100+"vw";


heart.style.animationDuration=
(6+Math.random()*6)+"s";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},12000);



},600);






/* ---------- runaway no button ---------- */


const no=document.getElementById("no");

const message=document.getElementById("message");


let escaped=false;


const messages=[

"hehe nice try 😌",

"almost got me 💨",

"nope hehe 💕",

"try again 🤭",

"you really thought 😂"

];



document.addEventListener("mousemove",(e)=>{


const rect=no.getBoundingClientRect();


const centerX=rect.left+rect.width/2;

const centerY=rect.top+rect.height/2;



let dx=e.clientX-centerX;

let dy=e.clientY-centerY;



let distance=Math.sqrt(dx*dx+dy*dy);



if(distance<100 && !escaped){


escaped=true;



message.innerHTML=
messages[Math.floor(Math.random()*messages.length)];


message.style.opacity=1;



// tiny shake

no.style.transform="rotate(8deg)";


setTimeout(()=>{


no.style.transform="rotate(-8deg)";


},100);





setTimeout(()=>{



let newX=Math.random()*170+200;

let newY=Math.random()*40-20;


no.style.left=newX+"px";

no.style.top=newY+"px";



message.style.opacity=0;


setTimeout(()=>{

escaped=false;

},500);



},200);



}



});





/* ---------- yes button ---------- */


document.getElementById("yes").onclick=()=>{


// confetti


for(let i=0;i<150;i++){


let c=document.createElement("div");


c.innerHTML=
["💖","🎉","✨","💕"]
[Math.floor(Math.random()*4)];



c.style.position="fixed";

c.style.left="50vw";

c.style.top="50vh";

c.style.fontSize=
(20+Math.random()*20)+"px";



let angle=Math.random()*Math.PI*2;

let speed=5+Math.random()*10;



let x=innerWidth/2;

let y=innerHeight/2;


let vx=Math.cos(angle)*speed;

let vy=Math.sin(angle)*speed;



document.body.appendChild(c);



let anim=setInterval(()=>{


x+=vx;

y+=vy;

vy+=.15;


c.style.left=x+"px";

c.style.top=y+"px";


c.style.opacity-=.02;



if(c.style.opacity<=0){

clearInterval(anim);

c.remove();

}


},16);



}




document.getElementById("card")
.classList.add("fade");



setTimeout(()=>{

window.location="memories.html";

},1000);



};



</script>


</body>

</html>
