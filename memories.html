<!DOCTYPE html>
<html lang="en">

<head>

<style>

body{

margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

font-family:Georgia;

}

.wrapper{

width:85%;
height:80%;

display:flex;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:0 20px 50px rgba(0,0,0,.15);

}

.slideshow{

flex:1;
position:relative;
overflow:hidden;

}

.slide{

position:absolute;
width:100%;
height:100%;

opacity:0;

transition:opacity 1s;

}

.slide img{

width:100%;
height:100%;
object-fit:cover;

}

.active{

opacity:1;

}

.text{

width:35%;

padding:50px;

display:flex;

justify-content:center;

align-items:center;

font-size:23px;

line-height:1.7;

background:#fff8fb;

}

</style>

</head>

<body>

</div>

</div>

<script>

const slides=document.querySelectorAll(".slide");

let current=0;

setInterval(()=>{

slides[current].classList.remove("active");

current=(current+1)%slides.length;

slides[current].classList.add("active");

},2500);

</script>

</body>
